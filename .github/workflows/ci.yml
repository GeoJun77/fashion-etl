# .github/workflows/ci.yml
# Lint + tests on every push and pull request.
# The test suite runs twice : on SQLite (local default) and on PostgreSQL (Docker setup).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6,<1"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fashion
          POSTGRES_PASSWORD: fashion123
          POSTGRES_DB: fashion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fashion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt "psycopg2-binary>=2.9,<3"

      - name: Run tests (${{ matrix.database }})
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://fashion:fashion123@localhost:5432/fashion_test' || '' }}
        run: python -m pytest --cov=src --cov-report=term-missing
