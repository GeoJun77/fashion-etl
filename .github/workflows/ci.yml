# .github/workflows/ci.yml
# Runs tests automatically on every push to develop

name: CI Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1 : checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 : setup Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3 : install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4 : run linter
      - name: Run linter (ruff)
        run: ruff check src/

      # Step 5 : run tests
      - name: Run tests
        run: python -m pytest tests/test_pipeline.py -v --tb=short

      # Step 6 : show coverage
      - name: Run tests with coverage
        run: python -m pytest tests/test_pipeline.py --cov=src --cov-report=term-missing